[project]
name = "tinker-plus"
version = "0.1.0"
description = "A helper for running games in non-windows environments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
]

[tool.pylint]
init-hook = "import sys; sys.path.insert(0, \".\")"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pylint>=4.0.2", "pytest>=9.0.0"]
